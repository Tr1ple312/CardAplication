version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: card_database
    environment:
      POSTGRES_DB: carddb
      POSTGRES_USER: carduser
      POSTGRES_PASSWORD: cardpass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carduser -d carddb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build:
      context: ./CardSite
      dockerfile: Dockerfile
    container_name: card_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 CardSite.wsgi:application"
    environment:
      POSTGRES_DB: carddb
      POSTGRES_USER: carduser
      POSTGRES_PASSWORD: cardpass123
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SETTINGS_MODULE: CardSite.settings
    volumes:
      - ./CardSite:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # React Frontend
  frontend:
    build:
      context: ./ReactFront/card-frontend
      dockerfile: Dockerfile
    container_name: card_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: